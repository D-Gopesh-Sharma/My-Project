<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — SmartFit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <script type="module" src="../js/authGuard.js"></script>
  <link rel="stylesheet" href="../style.css">
  <style>
    .profile-section { background: var(--lux-bg); }
    .profile-container {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
      align-items: start;
    }
    .profile-sidebar { position: sticky; top: 6rem; }
    .profile-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(212,175,55,0.12);
      border-radius: 6px;
      padding: 2rem;
      text-align: center;
      margin-bottom: 1rem;
    }
    .profile-avatar {
      position: relative;
      display: inline-block;
      margin-bottom: 1.2rem;
    }
    .profile-avatar img {
      width: 90px; height: 90px;
      border-radius: 50%;
      border: 2px solid rgba(212,175,55,0.3);
      object-fit: cover;
    }
    .change-avatar-btn {
      display: block;
      margin: 0.6rem auto 0;
      background: transparent;
      border: 1px solid rgba(212,175,55,0.25);
      color: var(--lux-muted);
      padding: 0.35rem 0.9rem;
      border-radius: 100px;
      cursor: pointer;
      font-size: 0.65rem;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: all 0.3s;
    }
    .change-avatar-btn:hover { border-color: var(--lux-gold); color: var(--lux-gold); }
    .profile-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--lux-text);
      margin-bottom: 0.3rem;
    }
    .profile-card p { font-size: 0.8rem; color: var(--lux-muted); }
    .profile-stats {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(212,175,55,0.1);
      border-radius: 6px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      text-align: center;
      overflow: hidden;
    }
    .stat {
      padding: 1.2rem 0.5rem;
      border-right: 1px solid rgba(212,175,55,0.08);
    }
    .stat:last-child { border-right: none; }
    .stat h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 300;
      color: var(--lux-gold);
      line-height: 1;
      margin-bottom: 0.3rem;
    }
    .stat p { font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--lux-muted); }
    .profile-tabs { display: flex; gap: 0; border-bottom: 1px solid rgba(212,175,55,0.1); margin-bottom: 2rem; }
    .tab-btn {
      padding: 0.75rem 1.5rem;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--lux-muted);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: all 0.3s;
      margin-bottom: -1px;
    }
    .tab-btn.active { color: var(--lux-text); border-bottom-color: var(--lux-gold); }
    .tab-btn:hover:not(.active) { color: var(--lux-text); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .tab-content h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 400;
      color: var(--lux-text);
      margin-bottom: 1.5rem;
    }
    .history-grid, .favorites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }
    .settings-form { max-width: 480px; }
    .form-group { margin-bottom: 1.4rem; }
    .form-group label {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--lux-gold);
      margin-bottom: 0.5rem;
    }
    .form-group input,
    .form-group select {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(212,175,55,0.2);
      border-radius: 4px;
      color: var(--lux-text);
      padding: 0.8rem 1.1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      width: 100%;
      outline: none;
      transition: border-color 0.3s;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--lux-gold); }
    .form-group select option { background: #0a0a0a; color: var(--lux-text); }
    .save-settings-btn {
      background: linear-gradient(135deg, var(--lux-gold), var(--lux-gold-soft));
      border: none;
      color: #0a0a0a;
      padding: 0.9rem 2.5rem;
      border-radius: 2px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 500;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .save-settings-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(212,175,55,0.3); }
    @media (max-width: 900px) {
      .profile-container { grid-template-columns: 1fr; }
      .profile-sidebar { position: static; }
    }
  </style>
</head>
<body class="luxury-page">

  <!-- ── LUXURY NAVBAR ──────────────────────────────────────── -->
  <nav class="luxury-nav" id="luxuryNav">
    <a href="index.html" class="lux-logo">SmartFit<span>.</span></a>
    <ul class="luxury-nav-links" id="luxNavLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="upload.html">Try On</a></li>
      <li><a href="catalog.html">Catalog</a></li>
      <li><a href="result.html">Results</a></li>
      <li><a href="profile.html">Profile</a></li>
    </ul>
    <a href="signin.html" id="authButton" class="lux-signin-btn">Sign In</a>
    <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- ── PROFILE SECTION ────────────────────────────────────── -->
  <section class="luxury-section profile-section">
    <div class="container">
      <div class="lux-section-label">My Account</div>
      <h1 class="lux-section-title" style="margin-bottom:2rem;">Your Profile</h1>

      <div class="profile-container">
        <!-- Sidebar -->
        <div class="profile-sidebar">
        <div class="profile-card">
          <div class="profile-avatar">
              <img id="profileAvatar" src="../assets/default-avatar.png">
              <button class="change-avatar-btn">Change Avatar</button>
          </div>

          <h2 id="profileName">User Name</h2>
          <p id="profileEmail">user@email.com</p>

          <button id="logoutBtn" class="logout-btn">
          Logout
          </button>

        </div>

          <div class="profile-stats">
            <div class="stat">
              <h3 id="tryOnsCount">0</h3>
              <p>Try-Ons</p>
            </div>
            <div class="stat">
              <h3 id="favoritesCount">0</h3>
              <p>Favorites</p>
            </div>
            <div class="stat">
              <h3 id="sharesCount">0</h3>
              <p>Shares</p>
            </div>
          </div>
        </div>

        <!-- Content -->
        <div class="profile-content">
          <div class="profile-tabs">
            <button class="tab-btn active" data-tab="history">Try-On History</button>
            <button class="tab-btn" data-tab="favorites">Favorites</button>
            <button class="tab-btn" data-tab="settings">Settings</button>
          </div>

          <div class="tab-content active" id="history">
            <h3>Your Try-On History</h3>
            <div class="history-grid" id="historyGrid"></div>
          </div>

          <div class="tab-content" id="favorites">
            <h3>Your Favorite Dresses</h3>
            <div class="favorites-grid" id="favoritesGrid"></div>
          </div>

          <div class="tab-content" id="settings">
            <h3>Account Settings</h3>
            <div class="settings-form">
              <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="settingsName" placeholder="Enter your name">
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="settingsEmail" placeholder="Enter your email">
              </div>
              <div class="form-group">
                <label>Preferred Style</label>
                <select id="preferredStyle">
                  <option value="casual">Casual</option>
                  <option value="formal">Formal</option>
                  <option value="party">Party</option>
                  <option value="traditional">Traditional</option>
                </select>
              </div>
              <button class="save-settings-btn">Save Changes</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ── FOOTER ─────────────────────────────────────────────── -->
  <footer class="luxury-footer">
    <div class="footer-logo">SmartFit<span>.</span></div>
    <p class="footer-copy">© 2025 SmartFit Inc. — Intelligent Styling</p>
  </footer>

  <!-- ── LOADER ─────────────────────────────────────────────── -->
  <div class="loader" id="loader">
    <div class="loader-content">
      <div class="particle-container">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div>
      </div>
      <p id="loaderText">Loading profile...</p>
    </div>
  </div>

  <script>
    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        const tab = document.getElementById(btn.dataset.tab);
        if (tab) tab.classList.add('active');
      });
    });
    // Update tryOns count from localStorage history
    window.addEventListener('DOMContentLoaded', () => {
      const history = JSON.parse(localStorage.getItem('SmartFit_history') || '[]');
      const countEl = document.getElementById('tryOnsCount');
      if (countEl) countEl.textContent = history.length;
    });
  </script>
  <script src="../js/cursor.js"></script>
  <script src="../js/loader.js"></script>
  <script type="module" src="../js/profile.js"></script>
  <script type="module" src="../js/navbarAuth.js"></script>
  <script src="../js/nav.js"></script>
</body>
</html>
