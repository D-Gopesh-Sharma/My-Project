<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — SmartFit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Jost:wght@200;300;400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('https://i.postimg.cc/RFPCTF1R/Gemini-Generated-Image-2tx82a2tx82a2tx8.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      cursor: none;
      min-height: 100vh;
    }

    /* Styles for the "glass" effect on the login card */
    .glass-card {
      background: rgba(26, 26, 26, 0.25);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Custom style for input fields */
    .custom-input {
      background-color: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      color: white;
    }
    .custom-input:focus {
      outline: none;
      border-bottom-color: white;
    }
    .custom-input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    /* Custom checkbox */
    .custom-checkbox {
      appearance: none;
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      background-color: transparent;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }
    .custom-checkbox:checked {
      background-color: #38A169;
      border-color: #38A169;
    }
    .custom-checkbox:checked::after {
      content: '✔';
      font-size: 12px;
      color: white;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    /* Page animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in     { animation: fadeIn 0.8s ease-out both; }
    .fade-in-up  { animation: fadeInUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .delay-1 { animation-delay: 0.08s; }
    .delay-2 { animation-delay: 0.16s; }
    .delay-3 { animation-delay: 0.24s; }
    .delay-4 { animation-delay: 0.32s; }
    .delay-5 { animation-delay: 0.40s; }
    @media (prefers-reduced-motion: reduce) {
      .fade-in, .fade-in-up { animation: none; }
    }

    /* Form error helper */
    .form-error {
      font-size: 0.75rem;
      color: #e07070;
      display: none;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body class="text-white">

  <!-- Colour bar -->
  <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-yellow-300 via-pink-400 to-purple-500 fade-in" style="z-index:50;"></div>

  <!-- ── LUXURY NAVBAR ──────────────────────────────────────── -->
  <nav class="luxury-nav" id="luxuryNav" style="position:absolute;">
    <a href="index.html" class="lux-logo">SmartFit<span>.</span></a>
    <ul class="luxury-nav-links" id="luxNavLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="upload.html">Try On</a></li>
      <li><a href="catalog.html">Catalog</a></li>
      <li><a href="result.html">Results</a></li>
      <li><a href="profile.html">Profile</a></li>
    </ul>
    <a href="signin.html" class="lux-signin-btn nav-active" style="background:rgba(212,175,55,0.15);color:var(--lux-gold)!important;">Sign In</a>
    <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- ── SIGN IN MAIN ────────────────────────────────────────── -->
  <main class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm rounded-2xl shadow-lg p-8 relative fade-in-up delay-2">
      <button id="close-home" class="absolute top-4 right-4 text-white text-2xl bg-gray-900/50 rounded-full h-8 w-8 flex items-center justify-center hover:bg-gray-800/70 transition-colors" aria-label="Close and go home">
        &times;
      </button>

      <h1 class="text-4xl font-bold mb-8 text-center fade-in delay-3">Login</h1>

      <form class="space-y-6" id="signinForm" novalidate>
        <div class="relative fade-in-up delay-3">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            class="custom-input w-full py-2 pl-2 pr-10 focus:ring-0"
            autocomplete="email"
            required
          >
          <span class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" /></svg>
          </span>
          <span class="form-error" id="emailError">Please enter a valid email.</span>
        </div>

        <div class="relative fade-in-up delay-4">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            class="custom-input w-full py-2 pl-2 pr-10 focus:ring-0"
            autocomplete="current-password"
            required
          >
          <span class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
          </span>
          <span class="form-error" id="passwordError">Password must be at least 6 characters.</span>
        </div>

        <div class="flex items-center justify-between text-sm fade-in delay-4">
          <label for="remember" class="flex items-center space-x-2 cursor-pointer text-gray-300">
            <input type="checkbox" id="remember" class="custom-checkbox">
            <span>Remember me</span>
          </label>
          <a href="#" class="font-medium text-green-300 hover:text-green-400 transition-colors">Forgot Password?</a>
        </div>

        <button type="submit" class="w-full bg-gray-900/80 hover:bg-gray-900/90 text-white font-bold py-3 rounded-lg transition-colors fade-in-up delay-5">
          Login
        </button>

        <div class="flex items-center my-4">
        <div class="flex-grow border-t border-gray-500"></div>
        <span class="mx-3 text-sm text-gray-300">OR</span>
        <div class="flex-grow border-t border-gray-500"></div>
      </div>

      <button id="googleLoginBtn"
        class="w-full flex items-center justify-center gap-3 bg-white text-black font-semibold py-3 rounded-lg hover:bg-gray-200 transition">

        <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20">
        Sign in with Google
      </button>

        <div class="text-center text-sm text-gray-300 fade-in delay-5">
          <p>Don't have an account? <a href="#" class="font-medium text-green-300 hover:text-green-400 transition-colors">Register</a></p>
        </div>
      </form>
    </div>
  </main>

  <script type="module">
  import {
    auth,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup
  } from "../js/firebase.js";
  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = "profile.html";
    }
  });
  </script>

  <script type="module">
    import {
    auth,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup
  } from "../js/firebase.js";
    // Close button → home
    (function () {
      var closeBtn = document.getElementById('close-home');
      if (closeBtn) closeBtn.addEventListener('click', function (e) {
        e.preventDefault();
        window.location.href = 'index.html';
      });
    })();

    // Form validation + sign-in logic
    const form = document.getElementById('signinForm');
    if (form) {
      form.addEventListener('submit', e => {
        e.preventDefault();
        const email    = document.getElementById('email');
        const pass     = document.getElementById('password');
        const emailErr = document.getElementById('emailError');
        const passErr  = document.getElementById('passwordError');
        let valid = true;
        emailErr.style.display = 'none';
        passErr.style.display  = 'none';
        if (!email.value || !/\S+@\S+\.\S+/.test(email.value)) {
          emailErr.style.display = 'block';
          valid = false;
        }
        if (!pass.value || pass.value.length < 6) {
          passErr.style.display = 'block';
          valid = false;
        }
        if (valid) {
          signInWithEmailAndPassword(auth, email.value, pass.value)
            .then(() => {
              window.location.href = "profile.html";
            })
            .catch((error) => {
              alert(error.message);
            });
        }
      });
    }

    const googleBtn = document.getElementById("googleLoginBtn");
    if (googleBtn) {
      googleBtn.addEventListener("click", async () => {
        try {
          const provider = new GoogleAuthProvider();
          await signInWithPopup(auth, provider);
          window.location.href = "profile.html";
        } catch (error) {
          alert(error.message);
        }
      });
    }

  </script>
  <script src="../js/cursor.js"></script>
  <script type="module" src="../js/navbarAuth.js"></script>
  <script src="../js/nav.js"></script>
</body>
</html>
