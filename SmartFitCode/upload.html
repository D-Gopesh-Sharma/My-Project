<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Try On — SmartFit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <script type="module" src="../js/authGuard.js"></script>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="luxury-page">

  <!-- ── LUXURY NAVBAR ──────────────────────────────────────── -->
  <nav class="luxury-nav" id="luxuryNav">
    <a href="index.html" class="lux-logo">SmartFit<span>.</span></a>
    <ul class="luxury-nav-links" id="luxNavLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="upload.html">Try On</a></li>
      <li><a href="catalog.html">Catalog</a></li>
      <li><a href="result.html">Results</a></li>
      <li><a href="profile.html">Profile</a></li>
    </ul>
    <a href="signin.html" id="authButton" class="lux-signin-btn">Sign In</a>
    <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- ── AI STUDIO SECTION ──────────────────────────────────── -->
  <section class="luxury-section" style="background:var(--lux-bg);">
    <div style="max-width:1100px;margin:0 auto;">
      <div class="lux-section-label">AI Studio</div>
      <h1 class="lux-section-title">SmartFit AI Try-On</h1>
      <p style="color:var(--lux-muted);font-size:0.9rem;margin-bottom:2.5rem;max-width:520px;line-height:1.8;">
        Upload your photo, choose a garment, and watch AI render your look in real time.
      </p>

      <div style="
        background:rgba(255,255,255,0.02);
        border:1px solid rgba(212,175,55,0.12);
        border-radius:8px;
        overflow:hidden;
        box-shadow:0 20px 60px rgba(0,0,0,0.5);
      ">
        <iframe
          src="http://127.0.0.1:7860"
          width="100%"
          height="900px"
          loading="lazy"
          allow="camera"
          style="border:none;display:block;background:#0a0a0a;"
        ></iframe>
      </div>

      <div style="margin-top:2rem;display:flex;gap:1rem;flex-wrap:wrap;">
        <a href="catalog.html" class="lux-btn-secondary">← Browse Catalog</a>
        <a href="result.html" class="lux-btn-primary">View Results →</a>
      </div>
    </div>
  </section>

  <!-- ── FOOTER ─────────────────────────────────────────────── -->
  <footer class="luxury-footer">
    <div class="footer-logo">SmartFit<span>.</span></div>
    <p class="footer-copy">© 2025 SmartFit Inc. — Intelligent Styling</p>
  </footer>

  <!-- ── LOADER ─────────────────────────────────────────────── -->
  <div class="loader" id="loader">
    <div class="loader-content">
      <div class="particle-container">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div>
      </div>
      <p id="loaderText">Loading AI Studio...</p>
    </div>
  </div>

  <script src="../js/cursor.js"></script>
  <script src="../js/loader.js"></script>
  <script src="../js/upload.js"></script>
  <script type="module" src="../js/navbarAuth.js"></script>
  <script src="../js/nav.js"></script>

</html>
