<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog — SmartFit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <script type="module" src="../js/authGuard.js"></script>
  <link rel="stylesheet" href="../style.css">
  <style>
    .catalog-section { background: var(--lux-bg); }
    .catalog-controls {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      margin-bottom: 2.5rem;
      max-width: 680px;
    }
    .search-container { display: flex; gap: 0; }
    .search-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(212,175,55,0.2);
      border-right: none;
      border-radius: 4px 0 0 4px;
      color: var(--lux-text);
      padding: 0.75rem 1.2rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      width: 100%;
      outline: none;
      transition: border-color 0.3s;
    }
    .search-input:focus { border-color: var(--lux-gold); }
    .search-input::placeholder { color: var(--lux-muted); }
    .search-btn {
      background: linear-gradient(135deg, var(--lux-gold), var(--lux-gold-soft));
      border: none;
      border-radius: 0 4px 4px 0;
      padding: 0.75rem 1.2rem;
      cursor: pointer;
      font-size: 1rem;
    }
    .filter-container { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .filter-btn {
      padding: 0.45rem 1.2rem;
      border: 1px solid rgba(212,175,55,0.25);
      background: transparent;
      color: var(--lux-muted);
      border-radius: 100px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: all 0.3s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: rgba(212,175,55,0.12);
      border-color: var(--lux-gold);
      color: var(--lux-gold);
    }
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }
    .load-more-container { text-align: center; margin-top: 3rem; }
    .load-more-btn {
      padding: 0.9rem 3rem;
      border: 1px solid rgba(212,175,55,0.35);
      background: transparent;
      color: var(--lux-text);
      border-radius: 2px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      transition: all 0.3s;
    }
    .load-more-btn:hover { background: rgba(212,175,55,0.08); border-color: var(--lux-gold); color: var(--lux-gold); }
    @media (max-width: 768px) { .catalog-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 480px) { .catalog-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="luxury-page">

  <!-- ── LUXURY NAVBAR ──────────────────────────────────────── -->
  <nav class="luxury-nav" id="luxuryNav">
    <a href="index.html" class="lux-logo">SmartFit<span>.</span></a>
    <ul class="luxury-nav-links" id="luxNavLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="upload.html">Try On</a></li>
      <li><a href="catalog.html">Catalog</a></li>
      <li><a href="result.html">Results</a></li>
      <li><a href="profile.html">Profile</a></li>
    </ul>
    <a href="signin.html" id="authButton" class="lux-signin-btn">Sign In</a>
    <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- ── CATALOG SECTION ────────────────────────────────────── -->
  <section class="luxury-section catalog-section">
    <div class="container">
      <div class="lux-section-label">Browse Collection</div>
      <h1 class="lux-section-title">Fashion Catalog</h1>
      <p style="color:var(--lux-muted);font-size:0.9rem;margin-bottom:2.5rem;max-width:520px;line-height:1.8;">
        Discover curated garments from our AI-powered catalog. Select any piece to start your virtual try-on.
      </p>

      <!-- Search and Filters -->
      <div class="catalog-controls">
        <div class="search-container">
          <input type="text" placeholder="Search dresses..." class="search-input" id="searchInput">
          <button class="search-btn">🔍</button>
        </div>
        <div class="filter-container">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="casual">Casual</button>
          <button class="filter-btn" data-filter="formal">Formal</button>
          <button class="filter-btn" data-filter="party">Party</button>
          <button class="filter-btn" data-filter="saree">Saree</button>
          <button class="filter-btn" data-filter="western">Western</button>
        </div>
      </div>

      <!-- Catalog Grid -->
      <div class="catalog-grid" id="catalogGrid"></div>

      <!-- Load More -->
      <div class="load-more-container">
        <button class="load-more-btn" id="loadMoreBtn">Load More Dresses</button>
      </div>
    </div>
  </section>

  <!-- ── FOOTER ─────────────────────────────────────────────── -->
  <footer class="luxury-footer">
    <div class="footer-logo">SmartFit<span>.</span></div>
    <p class="footer-copy">© 2025 SmartFit Inc. — Intelligent Styling</p>
  </footer>

  <!-- ── LOADER ─────────────────────────────────────────────── -->
  <div class="loader" id="loader">
    <div class="loader-content">
      <div class="particle-container">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div>
      </div>
      <p id="loaderText">Loading catalog...</p>
    </div>
  </div>

  <script src="../js/cursor.js"></script>
  <script src="../js/loader.js"></script>
  <script src="../js/catalog.js"></script>
  <script type="module" src="../js/navbarAuth.js"></script>
  <script src="../js/nav.js"></script>
</body>
</html>
